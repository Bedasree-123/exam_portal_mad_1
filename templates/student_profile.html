{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h1>My profile</h1>

<div class="card-box profile">
    <form method="post">
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" value="{{ user.email }}" disabled>
        </div>
        <div class="mb-3">
            <label class="form-label" for="name">Full name</label>
            <input class="form-control" id="name" name="name" value="{{ user.name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="department">Department</label>
            <input class="form-control" id="department" name="department" value="{{ user.department }}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="phone">Phone</label>
            <input class="form-control" id="phone" name="phone" type="tel" value="{{ user.phone }}">
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
    </form>
</div>
{% endblock %}
