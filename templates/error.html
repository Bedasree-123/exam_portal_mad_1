{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="card-box">
    <h1>Error {{ code }}</h1>
    <p>{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('dashboard') if current_user else url_for('login') }}">Go back</a>
</div>
{% endblock %}
