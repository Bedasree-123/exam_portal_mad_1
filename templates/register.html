{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card-box">
    <h1>Register</h1>
    <form method="post">
        <div class="mb-3">
            <label class="form-label" for="name">Full name</label>
            <input class="form-control" id="name" name="name" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="role">Register as</label>
            <select class="form-select" id="role" name="role">
                <option value="student">Student</option>
                <option value="examiner">Examiner</option>
            </select>
        </div>
        <div class="row">
            <div class="col-sm-6 mb-3">
                <label class="form-label" for="department">Department (optional)</label>
                <input class="form-control" id="department" name="department">
            </div>
            <div class="col-sm-6 mb-3">
                <label class="form-label" for="phone">Phone (optional)</label>
                <input class="form-control" id="phone" name="phone" type="tel">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" minlength="6" required>
            <div class="form-text">At least 6 characters.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Register</button>
    </form>
    <p class="mt-3 mb-0 text-center">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
